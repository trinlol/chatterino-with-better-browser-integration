<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      width: 280px;
      margin: 0;
      padding: 16px;
      background: linear-gradient(135deg, #0e0e13 0%, #171725 100%);
      color: #e4e4e7;
      user-select: none;
    }

    h3 {
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 16px;
      font-weight: 600;
      color: #a970ff;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      backdrop-filter: blur(10px);
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .setting-row:last-child {
      margin-bottom: 0;
    }

    .label-group {
      display: flex;
      flex-direction: column;
    }

    .title {
      font-size: 13px;
      font-weight: 500;
      color: #f4f4f5;
    }

    .description {
      font-size: 11px;
      color: #71717a;
      margin-top: 2px;
    }

    /* Switch styling */
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #27272a;
      transition: .3s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: #e4e4e7;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #a970ff;
    }

    input:focus + .slider {
      box-shadow: 0 0 1px #a970ff;
    }

    input:checked + .slider:before {
      transform: translateX(16px);
      background-color: #ffffff;
    }

    /* Slider input controls */
    .control-group {
      margin-bottom: 12px;
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .control-label {
      font-size: 12px;
      font-weight: 500;
      color: #a1a1aa;
    }

    .control-value {
      font-size: 11px;
      font-family: monospace;
      color: #a970ff;
      background: rgba(169, 112, 255, 0.1);
      padding: 1px 4px;
      border-radius: 4px;
    }

    .range-input {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: #27272a;
      outline: none;
      margin: 8px 0;
    }

    .range-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #a970ff;
      cursor: pointer;
      transition: .15s ease-in-out;
    }

    .range-input::-webkit-slider-thumb:hover {
      transform: scale(1.25);
      background: #c084fc;
    }

    .btn {
      width: 100%;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      color: #ffffff;
      background: linear-gradient(135deg, #a970ff 0%, #7c3aed 100%);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.2);
    }

    .btn:hover {
      filter: brightness(1.1);
      box-shadow: 0 4px 16px rgba(124, 58, 237, 0.35);
    }

    .btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <h3>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
      <circle cx="12" cy="12" r="4"/>
    </svg>
    Predictions Settings
  </h3>

  <div class="card">
    <div class="setting-row">
      <div class="label-group">
        <span class="title">Channel Points Claimer</span>
        <span class="description">Auto-claim green chest rewards</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="autoClaimCheckbox" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="card">
    <div class="control-group">
      <div class="control-header">
        <span class="control-label">Floating Banner Top</span>
        <span class="control-value" id="topVal">120px</span>
      </div>
      <input type="range" class="range-input" id="topRange" min="0" max="1000" value="120">
    </div>

    <div class="control-group">
      <div class="control-header">
        <span class="control-label">Floating Banner Left</span>
        <span class="control-value" id="leftVal">20px</span>
      </div>
      <input type="range" class="range-input" id="leftRange" min="0" max="2000" value="20">
    </div>

    <button class="btn" id="resetBtn">Reset Positions</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
