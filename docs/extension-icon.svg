<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="tileBg" x1="20" y1="16" x2="236" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B2E"/>
      <stop offset="55%" stop-color="#151421"/>
      <stop offset="100%" stop-color="#101018"/>
    </linearGradient>
    <linearGradient id="tileBorder" x1="28" y1="16" x2="228" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#76D4FF" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#9146FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2E2A45" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="dockGrad" x1="146" y1="48" x2="224" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6DD5FF"/>
      <stop offset="52%" stop-color="#6F8CFF"/>
      <stop offset="100%" stop-color="#9146FF"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="72" y1="106" x2="114" y2="156" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B993FF"/>
      <stop offset="100%" stop-color="#7E42F5"/>
    </linearGradient>
    <linearGradient id="screenBg" x1="40" y1="74" x2="136" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#26223A"/>
      <stop offset="100%" stop-color="#1A1829"/>
    </linearGradient>
    <filter id="dockGlow" x="128" y="36" width="112" height="196" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="-3" dy="6" stdDeviation="8" flood-color="#5B8EFF" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer rounded app tile -->
  <rect x="10" y="10" width="236" height="236" rx="54" fill="url(#tileBg)" stroke="url(#tileBorder)" stroke-width="4"/>

  <!-- Browser frame (left viewport + top chrome) -->
  <rect x="34" y="44" width="188" height="168" rx="22" fill="#171625" stroke="#363252" stroke-width="4"/>

  <!-- Browser top bar -->
  <path d="M36 66C36 54.954 44.954 46 56 46H142V76H36V66Z" fill="#232037"/>
  <circle cx="56" cy="61" r="5" fill="#FF6B7A"/>
  <circle cx="74" cy="61" r="5" fill="#FFD166"/>
  <circle cx="92" cy="61" r="5" fill="#5CE1A6"/>

  <!-- Stream viewport area on left -->
  <path d="M36 76H142V210H56C44.954 210 36 201.046 36 190V76Z" fill="url(#screenBg)"/>

  <!-- Subtle play mark inside stream viewport -->
  <circle cx="89" cy="136" r="27" fill="#141222" fill-opacity="0.7" stroke="#53497D" stroke-width="2.5"/>
  <path d="M81 123.5L103 136L81 148.5V123.5Z" fill="url(#playGrad)"/>

  <!-- Docked Chatterino chat column on right (hero element) -->
  <g filter="url(#dockGlow)">
    <path d="M142 44H200C212.15 44 222 53.85 222 66V190C222 202.15 212.15 212 200 212H154L142 222V44Z" fill="url(#dockGrad)"/>
  </g>

  <!-- Crisp inner seam highlight on the docked edge -->
  <rect x="142" y="44" width="3.5" height="178" fill="#FFFFFF" fill-opacity="0.45"/>

  <!-- Chat message bars inside docked chat panel -->
  <!-- Message 1 -->
  <circle cx="160" cy="76" r="6" fill="#FFFFFF" fill-opacity="0.95"/>
  <rect x="172" y="70" width="36" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.95"/>

  <!-- Message 2 -->
  <circle cx="160" cy="106" r="6" fill="#D8F4FF" fill-opacity="0.92"/>
  <rect x="172" y="100" width="28" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.82"/>

  <!-- Message 3 -->
  <circle cx="160" cy="136" r="6" fill="#FFFFFF" fill-opacity="0.95"/>
  <rect x="172" y="130" width="36" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.92"/>

  <!-- Message 4 -->
  <circle cx="160" cy="166" r="6" fill="#E8D8FF" fill-opacity="0.95"/>
  <rect x="172" y="160" width="24" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.8"/>

  <!-- Mini chat input bar at bottom of docked panel -->
  <rect x="154" y="186" width="56" height="14" rx="7" fill="#131122" fill-opacity="0.42"/>
</svg>
