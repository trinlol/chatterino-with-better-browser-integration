<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d" font-family="'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif">
<title id="t">Chatterino Better Browser</title>
<desc id="d">Animation: Twitch chat messages travel from the browser through the extension and the Chatterino app into a desktop chat window, followed by a pinned message, a prediction countdown and a channel points claim.</desc>
